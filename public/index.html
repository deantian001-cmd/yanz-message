<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18"><title>Yanz Message</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#080d18;--panel:#111a2b;--line:#26344c;--text:#edf3ff;--muted:#91a0b8;--blue:#4f8cff;--green:#31d69a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#1a3154 0,#080d18 48%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;transition:transform .18s ease,filter .18s ease,background .18s ease}button:active{transform:scale(.95)}button:hover{filter:brightness(1.12)}.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;animation:fade .4s ease both}.auth-card{width:min(420px,100%);background:#111a2bf5;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px #0007;animation:pop .5s ease both}
.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--blue)}.sub{color:var(--muted);margin:8px 0 24px}
.field{width:100%;padding:14px 15px;margin:7px 0;background:#0b1322;border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}.field:focus,.search:focus,.composer input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4f8cff20}
.primary{background:linear-gradient(135deg,#4f8cff,#7165ff);color:white;padding:13px 18px;border-radius:12px;font-weight:750}.full{width:100%;margin-top:12px}.switch{background:none;color:#9ebcff;margin-top:16px;width:100%}.notice{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px}
.app{height:100dvh;max-width:1500px;margin:auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:14px;animation:fade .35s ease both}
.sidebar,.chat{background:#111a2bf5;border:1px solid var(--line);border-radius:22px;min-height:0;overflow:hidden;box-shadow:0 16px 55px #0002}.sidebar{display:flex;flex-direction:column}
.side-top{padding:18px 18px 13px;border-bottom:1px solid var(--line)}.side-top .brand{font-size:23px}.me-line{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:13px}.me-info{display:flex;align-items:center;gap:5px;min-width:0;flex:1}.me-info strong{overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#345eaa,#7659c8);font-weight:800;flex:none;overflow:hidden;color:white}.avatar img,.status-avatar img{width:100%;height:100%;object-fit:cover}.avatar-button{padding:0;background:transparent;border-radius:15px}
.small-btn,.ghost{background:#202d45;color:#dce7fb;border:1px solid #30415f;padding:8px 11px;border-radius:10px;font-size:12px}
.status-section{padding:12px 12px 7px;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px;font-size:12px;font-weight:800;color:#bdcbe0;letter-spacing:.5px}
.status-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}.status-card{flex:0 0 76px;width:76px;background:transparent;color:var(--text);text-align:center;padding:0 2px}
.status-ring{width:58px;height:58px;margin:0 auto 6px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#a46bff);display:grid;place-items:center}.status-ring.seen{background:#536078}
.status-avatar{width:100%;height:100%;border:2px solid var(--panel);border-radius:50%;background:#263b60;display:grid;place-items:center;overflow:hidden;font-weight:800}.status-label{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dce7fb}
.status-card.add .status-ring{background:#253650}.status-card.add .status-avatar{font-size:25px;color:#9fc0ff}
.search{margin:12px 14px 8px;width:calc(100% - 28px);padding:12px;background:#0b1322;border:1px solid var(--line);border-radius:12px;color:white;outline:none}
.list-title{padding:8px 17px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.user-list{overflow:auto;padding:4px 9px 14px;flex:1}
.user{width:100%;display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;background:transparent;color:var(--text);text-align:left;margin:3px 0;transition:background .2s,transform .2s;animation:slide .25s ease both}.user.active,.user:hover{background:#1d2b44}.user:active{transform:scale(.985)}
.user-meta{min-width:0;flex:1}.user-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-sub{font-size:12px;color:var(--muted);margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#68758a;margin-right:5px}.dot.on{background:var(--green);box-shadow:0 0 9px #31d69a}.unread{min-width:21px;height:21px;padding:0 6px;display:grid;place-items:center;border-radius:20px;background:var(--green);color:#06261b;font-size:11px;font-weight:900;animation:pop .25s ease both}
.chat{display:flex;flex-direction:column;position:relative}.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:76px}
.chat-head-info{flex:1;min-width:0}.chat-head-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-head-info small{color:var(--muted)}.head-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.bubble-row{display:flex;flex-direction:column;max-width:min(78%,520px);align-self:flex-start;animation:messageIn .28s cubic-bezier(.2,.8,.2,1) both}.bubble-row.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:#1b2941;border:1px solid #2a3a56;padding:11px 13px;border-radius:16px 16px 16px 5px;overflow-wrap:anywhere;line-height:1.45;box-shadow:0 5px 16px #0001}
.mine .bubble{background:linear-gradient(135deg,#285db1,#554bb0);border-color:#567bd1;border-radius:16px 16px 5px 16px}.bubble img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-bottom:7px}
.time{font-size:10px;color:#b0bfd6;margin-top:5px}.msg-actions{display:flex;gap:6px;margin-top:5px;opacity:.85}.msg-actions button{font-size:10px;padding:5px 8px;border-radius:8px;background:#26344b;color:#dce7fb}.deleted{font-style:italic;color:#aab6c9}.reply-tag{font-size:10px;color:#d6e4ff;background:#ffffff17;padding:4px 7px;border-radius:7px;margin-bottom:6px;display:inline-block}
.composer{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}.composer input[type=text]{flex:1;min-width:0;padding:13px 14px;border-radius:13px;background:#0b1322;border:1px solid var(--line);color:white;outline:none}
.send{background:var(--blue);color:white;border-radius:12px;padding:12px 16px;font-weight:750}.photo-btn{background:#202d45;color:#dce7fb;border:1px solid #30415f;padding:12px;border-radius:12px}
#photoInput,#avatarInput,#statusPhotoInput{display:none}.mobile-back{display:none}
.overlay{position:fixed;inset:0;background:#030712d9;backdrop-filter:blur(9px);z-index:20;display:grid;place-items:center;padding:18px;animation:fade .2s ease both}
.modal{width:min(480px,100%);max-height:min(85dvh,760px);overflow:auto;background:#111a2b;border:1px solid #344663;border-radius:22px;padding:20px;box-shadow:0 25px 90px #0009;animation:pop .28s ease both}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h3{margin:0;font-size:18px}.close{width:32px;height:32px;border-radius:10px;background:#26344b;color:white;font-size:18px}
.status-preview{min-height:130px;border-radius:16px;background:#0b1322;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;margin:12px 0}.status-preview img{width:100%;max-height:360px;object-fit:contain}.status-preview p{padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:19px}
.status-text{width:100%;min-height:100px;resize:vertical;padding:13px;border-radius:13px;background:#0b1322;border:1px solid var(--line);color:white;outline:none}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.viewer-list{display:grid;gap:9px}.viewer-item{display:flex;align-items:center;gap:10px;background:#19263b;padding:9px;border-radius:12px}.viewer-item small{display:block;color:var(--muted);margin-top:2px}
.status-progress{height:3px;background:#ffffff38;border-radius:5px;overflow:hidden;margin-bottom:14px}.status-progress span{display:block;height:100%;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:#263a59;color:white;border:1px solid #49648b;border-radius:12px;padding:11px 16px;box-shadow:0 10px 35px #0007;animation:pop .2s ease both;font-size:13px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:translateX(0)}}@keyframes messageIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){.app{padding:0;display:block;height:100dvh}.sidebar,.chat{border-radius:0;height:100dvh;border:0}.chat{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.mobile-back{display:inline-block}.bubble-row{max-width:88%}.head-actions .small-btn{padding:7px 8px}.chat-head{padding:12px}.messages{padding:16px 12px}.composer{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="auth" class="auth-wrap"><div class="auth-card">
 <div class="brand">YANZ <span>MESSAGE</span></div><p class="sub">Ngobrol lebih dekat, kapan saja.</p>
 <form id="authForm"><input class="field" id="username" placeholder="Username" autocomplete="username" required minlength="3" maxlength="20">
 <input class="field" id="password" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password" required>
 <button class="primary full" id="authSubmit">Masuk</button></form>
 <button class="switch" id="authSwitch">Belum punya akun? Daftar</button><div class="notice" id="authNotice"></div>
</div></section>
<main id="app" class="app hidden">
 <aside class="sidebar"><div class="side-top"><div class="brand">YANZ <span>MESSAGE</span></div>
  <div class="me-line"><button class="avatar-button" id="myAvatarBtn" title="Ganti foto profil"><div class="avatar" id="myAvatar">Y</div></button>
   <div class="me-info"><strong id="myName">Akun</strong><small> · Profil</small></div><button class="small-btn" id="logoutBtn">Keluar</button></div>
  <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp,image/gif">
 </div>
 <div class="status-section"><div class="section-head"><span>STATUS 24 JAM</span><button class="small-btn" id="addStatusBtn">＋ Status</button></div><div id="statusStrip" class="status-strip"></div></div>
 <input id="search" class="search" placeholder="Cari pengguna atau kontak..."><div class="list-title">Semua pengguna</div><div id="userList" class="user-list"></div>
 </aside>
 <section class="chat"><header class="chat-head"><button id="backBtn" class="small-btn mobile-back">‹</button><div class="avatar" id="chatAvatar">Y</div>
  <div class="chat-head-info"><strong id="chatTitle">Pilih percakapan</strong><small id="chatStatus">Pesan pribadi</small></div>
  <div class="head-actions"><button id="saveContactBtn" class="small-btn">Simpan nama</button><button id="removeContactBtn" class="small-btn">Hapus kontak</button></div>
 </header>
 <div id="messages" class="messages"><div class="empty">Pilih seseorang untuk mulai mengobrol 💬</div></div>
 <form id="composer" class="composer"><input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp,image/gif">
  <button type="button" id="photoBtn" class="photo-btn" title="Kirim foto">＋</button><input type="text" id="messageInput" placeholder="Tulis pesan..." maxlength="2000" autocomplete="off"><button class="send" type="submit">Kirim</button>
 </form></section>
</main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
let me="",myProfilePhoto="",socket=null,selected="",users=[],contacts=[],online=[],statuses=[],registerMode=false;
const $=id=>document.getElementById(id),auth=$("auth"),app=$("app");
async function api(url,options={}){const r=await fetch(url,{credentials:"include",...options,headers:{...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Terjadi kesalahan.");return d;}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){$("toastRoot").innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$("toastRoot").innerHTML="",2600);}
async function uploadFile(file){const f=new FormData();f.append("photo",file);const r=await fetch("/upload",{method:"POST",body:f,credentials:"include"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Upload gagal.");return d.imageUrl;}
function contactFor(u){return contacts.find(c=>c.username===u);}function displayName(u){return contactFor(u)?.name||u;}
function profileFor(u){return users.find(x=>x.username===u)?.profilePhoto||"";}
$("authSwitch").onclick=()=>{registerMode=!registerMode;$("authSubmit").textContent=registerMode?"Daftar akun":"Masuk";$("authSwitch").textContent=registerMode?"Sudah punya akun? Masuk":"Belum punya akun? Daftar";$("password").autocomplete=registerMode?"new-password":"current-password";$("authNotice").textContent="";};
$("authForm").onsubmit=async e=>{e.preventDefault();$("authNotice").textContent="Memproses...";try{const d=await api(registerMode?"/register":"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});await startApp(d.username);}catch(err){$("authNotice").textContent=err.message;}};
async function checkLogin(){try{const d=await api("/me");if(d.user)await startApp(d.user.username,d.user.profilePhoto);}catch(_){}}
async function startApp(username,photo=""){me=username;myProfilePhoto=photo||"";$("myName").textContent="@"+me;renderMyAvatar();auth.classList.add("hidden");app.classList.remove("hidden");
 socket=io({withCredentials:true});socket.on("connect_error",e=>console.warn("Socket:",e.message));
 socket.on("online-users",list=>{online=list||[];renderUsers();updateChatStatus();});
 socket.on("unread-counts",()=>refreshUsers());
 socket.on("private-message",m=>{if(selected&&(m.from===selected||m.to===selected)){if(m.from===selected)loadMessages(selected);else addMessage(m);}refreshUsers();});
 socket.on("message-updated",m=>{const el=document.querySelector('[data-message-id="'+CSS.escape(m.id)+'"]');if(el){if(m.deletedForEveryone){const b=el.querySelector(".bubble");if(b)b.innerHTML='<span class="deleted">Pesan dihapus untuk semua orang</span>';const a=el.querySelector(".msg-actions");if(a)a.remove();}else if((m.deletedFor||[]).includes(me))el.remove();}if(selected)loadMessages(selected);refreshUsers();});
 socket.on("profile-updated",d=>{const u=users.find(x=>x.username===d.username);if(u)u.profilePhoto=d.profilePhoto;if(d.username===me){myProfilePhoto=d.profilePhoto;renderMyAvatar();}renderUsers();renderStatuses();if(selected===d.username)renderChatAvatar();});
 await loadUsers();await loadContacts();await loadStatuses();renderUsers();}
async function loadUsers(){users=await api("/users");}async function refreshUsers(){try{await loadUsers();renderUsers();}catch(_){}}
async function loadContacts(){contacts=await api("/contacts");}async function loadStatuses(){try{statuses=await api("/statuses");renderStatuses();}catch(e){console.warn(e);}}
function renderMyAvatar(){$("myAvatar").innerHTML=myProfilePhoto?`<img src="${esc(myProfilePhoto)}" alt="Foto profil">`:esc(me.slice(0,1).toUpperCase());}
function renderChatAvatar(){const p=profileFor(selected);$("chatAvatar").innerHTML=p?`<img src="${esc(p)}" alt="">`:esc(displayName(selected).slice(0,1).toUpperCase());}
function renderUsers(){const q=$("search").value.toLowerCase(),list=$("userList");list.innerHTML="";const filtered=users.filter(u=>u.username.toLowerCase().includes(q)||displayName(u.username).toLowerCase().includes(q));if(!filtered.length){list.innerHTML='<div class="empty">Belum ada pengguna lain.</div>';return;}
 filtered.forEach(u=>{const b=document.createElement("button");b.className="user"+(selected===u.username?" active":"");const a=document.createElement("div");a.className="avatar";a.innerHTML=u.profilePhoto?`<img src="${esc(u.profilePhoto)}" alt="">`:esc(displayName(u.username).slice(0,1).toUpperCase());const meta=document.createElement("div");meta.className="user-meta";const n=document.createElement("div");n.className="user-name";n.textContent=displayName(u.username);const s=document.createElement("div");s.className="user-sub";s.innerHTML=`<span class="dot ${online.includes(u.username)?"on":""}"></span>${online.includes(u.username)?"Online":"Offline"}${contactFor(u.username)?" · Kontak tersimpan":""}`;meta.append(n,s);b.append(a,meta);if(u.unreadCount>0){const badge=document.createElement("span");badge.className="unread";badge.textContent=u.unreadCount>99?"99+":u.unreadCount;b.append(badge);}b.onclick=()=>openChat(u.username);list.append(b);});}
$("search").oninput=renderUsers;
async function openChat(u){selected=u;app.classList.add("chat-open");$("chatTitle").textContent=displayName(u);renderChatAvatar();$("messages").innerHTML='<div class="empty">Memuat pesan...</div>';renderUsers();updateChatStatus();await loadMessages(u);}
function updateChatStatus(){if(selected)$("chatStatus").textContent=online.includes(selected)?"● Online":"Offline · Pesan pribadi";}
async function loadMessages(u){try{const list=await api("/messages/"+encodeURIComponent(u));if(selected!==u)return;$("messages").innerHTML="";if(!list.length)$("messages").innerHTML='<div class="empty">Belum ada pesan. Sapa dulu 👋</div>';else list.forEach(addMessage);$("messages").scrollTop=$("messages").scrollHeight;refreshUsers();}catch(e){$("messages").innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}
function addMessage(m){if(!m||!m.id||document.querySelector('[data-message-id="'+CSS.escape(m.id)+'"]'))return;if(m.deletedForEveryone||(m.deletedFor||[]).includes(me))return;const row=document.createElement("div");row.className="bubble-row"+(m.from===me?" mine":"");row.dataset.messageId=m.id;const bubble=document.createElement("div");bubble.className="bubble";if(m.type==="deleted")bubble.innerHTML='<span class="deleted">Pesan dihapus untuk semua orang</span>';else{if(m.type==="status-reply"){const tag=document.createElement("span");tag.className="reply-tag";tag.textContent="↩ Balasan status";bubble.append(tag);}if(m.imageUrl&&/^\/uploads\/[a-zA-Z0-9._-]+$/.test(m.imageUrl)){const img=document.createElement("img");img.src=m.imageUrl;img.alt="Foto";img.loading="lazy";bubble.append(img);}if(m.message){const t=document.createElement("div");t.textContent=m.message;bubble.append(t);}}
 const time=document.createElement("div");time.className="time";time.textContent=(m.from===me?"Kamu":displayName(m.from))+" · "+(m.time||"");row.append(bubble,time);if(m.type!=="deleted"){const actions=document.createElement("div");actions.className="msg-actions";const del=document.createElement("button");del.textContent="Hapus";del.onclick=()=>deleteMessage(m);actions.append(del);row.append(actions);} $("messages").append(row);$("messages").scrollTop=$("messages").scrollHeight;}
function deleteMessage(m){if(!socket)return;if(m.from===me){const all=confirm("Hapus pesan ini untuk SEMUA ORANG?\\nPilih Batal untuk menghapus hanya dari chat kamu.");if(all){if(confirm("Yakin hapus untuk semua orang?"))socket.emit("delete-message",{id:m.id,mode:"everyone"});}else if(confirm("Hapus pesan ini hanya untuk kamu?"))socket.emit("delete-message",{id:m.id,mode:"me"});}else if(confirm("Hapus pesan ini hanya dari chat kamu?"))socket.emit("delete-message",{id:m.id,mode:"me"});}
$("saveContactBtn").onclick=async()=>{if(!selected)return alert("Pilih chat terlebih dahulu.");const old=contactFor(selected),name=prompt("Nama kontak untuk "+selected+":",old?old.name:selected);if(name===null)return;try{await api("/contacts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:selected,name:name.trim()})});await loadContacts();$("chatTitle").textContent=displayName(selected);renderUsers();await loadMessages(selected);}catch(e){alert(e.message);}};
$("removeContactBtn").onclick=async()=>{if(!selected)return alert("Pilih chat terlebih dahulu.");if(!contactFor(selected))return alert("Kontak ini belum disimpan.");if(!confirm("Hapus nama kontak tersimpan?"))return;try{await api("/contacts/"+encodeURIComponent(selected),{method:"DELETE"});await loadContacts();$("chatTitle").textContent=displayName(selected);renderUsers();await loadMessages(selected);}catch(e){alert(e.message);}};
$("composer").onsubmit=e=>{e.preventDefault();if(!selected)return alert("Pilih pengguna terlebih dahulu.");const input=$("messageInput"),message=input.value.trim();if(!message)return;socket.emit("private-message",{to:selected,message});input.value="";};
$("photoBtn").onclick=()=>{if(!selected)return alert("Pilih chat terlebih dahulu.");$("photoInput").click();};
$("photoInput").onchange=async()=>{const f=$("photoInput").files[0];if(!f)return;if(f.size>5*1024*1024){alert("Ukuran foto maksimal 5 MB.");$("photoInput").value="";return;}try{$("photoBtn").textContent="…";const imageUrl=await uploadFile(f);socket.emit("private-message",{to:selected,imageUrl});}catch(e){alert(e.message);}finally{$("photoBtn").textContent="＋";$("photoInput").value="";}};
$("myAvatarBtn").onclick=()=>$("avatarInput").click();
$("avatarInput").onchange=async()=>{const f=$("avatarInput").files[0];if(!f)return;if(f.size>5*1024*1024){alert("Ukuran foto maksimal 5 MB.");$("avatarInput").value="";return;}try{const imageUrl=await uploadFile(f),d=await api("/profile/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageUrl})});myProfilePhoto=d.profilePhoto;renderMyAvatar();toast("Foto profil diperbarui!");}catch(e){alert(e.message);}finally{$("avatarInput").value="";}};

function renderStatuses(){const strip=$("statusStrip");if(!strip)return;strip.innerHTML="";const own=statuses.filter(s=>s.username===me);const add=document.createElement("button");add.className="status-card add";add.innerHTML='<span class="status-ring"><span class="status-avatar">＋</span></span><span class="status-label">Status saya</span>';add.onclick=()=>own.length?viewStatus(own[0]):openStatusComposer();strip.append(add);
 const latest=new Map();statuses.filter(s=>s.username!==me).forEach(s=>{if(!latest.has(s.username))latest.set(s.username,s);});latest.forEach(s=>{const b=document.createElement("button");b.className="status-card";const photo=profileFor(s.username);const avatar=photo?`<span class="status-avatar"><img src="${esc(photo)}" alt=""></span>`:`<span class="status-avatar">${esc(displayName(s.username).slice(0,1).toUpperCase())}</span>`;b.innerHTML=`<span class="status-ring ${s.viewedByMe?"seen":""}">${avatar}</span><span class="status-label">${esc(displayName(s.username))}</span>`;b.onclick=()=>viewStatus(s);strip.append(b);});}
$("addStatusBtn").onclick=openStatusComposer;
function openModal(html){$("modalRoot").innerHTML=`<div class="overlay" id="activeOverlay"><div class="modal">${html}</div></div>`;$("activeOverlay").onclick=e=>{if(e.target.id==="activeOverlay")closeModal();};}
function closeModal(){$("modalRoot").innerHTML="";}
function openStatusComposer(){openModal(`<div class="modal-head"><h3>Buat status</h3><button class="close" id="closeModal">×</button></div><textarea id="statusText" class="status-text" maxlength="500" placeholder="Apa yang sedang kamu pikirkan?"></textarea><div class="status-preview" id="statusPreview"><span style="color:#91a0b8">Pratinjau foto status</span></div><input type="file" id="statusPhotoInput" accept="image/jpeg,image/png,image/webp,image/gif"><div class="modal-actions"><button class="ghost" id="chooseStatusPhoto">＋ Tambah foto</button><button class="primary" id="publishStatus">Bagikan status</button></div><div class="notice">Status hilang otomatis setelah 24 jam. Maksimal foto 5 MB.</div>`);
 $("closeModal").onclick=closeModal;let file=null;$("chooseStatusPhoto").onclick=()=>$("statusPhotoInput").click();$("statusPhotoInput").onchange=()=>{file=$("statusPhotoInput").files[0]||null;if(file){if(file.size>5*1024*1024){alert("Ukuran foto maksimal 5 MB.");file=null;return;}$("statusPreview").innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Pratinjau">`;}};
 $("publishStatus").onclick=async()=>{const text=$("statusText").value.trim();if(!text&&!file)return alert("Isi teks atau pilih foto status.");try{const imageUrl=file?await uploadFile(file):"";await api("/statuses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,imageUrl})});closeModal();await loadStatuses();toast("Status berhasil dibagikan!");}catch(e){alert(e.message);}};}
async function viewStatus(s){try{await api(`/statuses/${encodeURIComponent(s.id)}/view`,{method:"POST"});const own=s.username===me,views=own?await api(`/statuses/${encodeURIComponent(s.id)}/views`):[];openModal(`<div class="modal-head"><h3>${esc(displayName(s.username))}</h3><button class="close" id="closeModal">×</button></div><div class="status-progress"><span style="width:100%"></span></div><div class="status-preview">${s.imageUrl?`<img src="${esc(s.imageUrl)}" alt="Status">`:`<p>${esc(s.text)}</p>`}</div>${s.imageUrl&&s.text?`<p style="white-space:pre-wrap">${esc(s.text)}</p>`:""}<div class="section-head"><span>${own?`Dilihat ${views.length} orang`:"Status · 24 jam"}</span>${own?'<button class="small-btn" id="showViewers">Lihat penonton</button>':""}</div>${own?'<div id="viewers" class="viewer-list"></div>':'<div class="modal-actions"><input id="statusReply" class="field" style="margin:0;flex:1" maxlength="1000" placeholder="Balas status..."><button class="primary" id="sendStatusReply">Kirim</button></div>'}`);
 $("closeModal").onclick=closeModal;if(own){const list=$("viewers");list.innerHTML=views.length?views.map(v=>`<div class="viewer-item"><div class="avatar">${v.profilePhoto?`<img src="${esc(v.profilePhoto)}" alt="">`:esc(v.username.slice(0,1).toUpperCase())}</div><div><strong>${esc(v.username)}</strong><small>${new Date(v.viewedAt).toLocaleString("id-ID")}</small></div></div>`).join(""):'<div class="empty">Belum ada yang menonton.</div>';$("showViewers").onclick=()=>list.scrollIntoView({behavior:"smooth",block:"nearest"});}
 else $("sendStatusReply").onclick=async()=>{const message=$("statusReply").value.trim();if(!message)return;try{await api(`/statuses/${encodeURIComponent(s.id)}/reply`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});closeModal();await openChat(s.username);toast("Balasan status terkirim!");}catch(e){alert(e.message);}};await loadStatuses();}catch(e){toast(e.message);await loadStatuses();}}
$("logoutBtn").onclick=async()=>{try{await api("/logout",{method:"POST"});}catch(_){}if(socket)socket.disconnect();location.reload();};
$("backBtn").onclick=()=>{app.classList.remove("chat-open");selected="";renderUsers();};
checkLogin();
</script>
</body></html>
